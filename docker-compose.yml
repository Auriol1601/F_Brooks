services:
  structurizr:
    # Même image que celle utilisée par automation/structurizr_writer.py
    # pour valider le DSL (variable STRUCTURIZR_IMAGE).
    image: structurizr/structurizr:2026.09.19
    container_name: f_brooks_structurizr
    command: local
    ports:
      - "8080:8080"
    volumes:
      # Dossier affiché : celui du projet en cours (FBROOKS_PROJECT_DIR,
      # défini dans .env), sinon le dossier des tests.
      - ${FBROOKS_PROJECT_DIR:-./structurizr}:/usr/local/structurizr
    restart: unless-stopped
